<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ember Isles — Make the Best Flight Game</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #14101f;
      color: #e9e4f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #game {
      display: block;
      margin: 0 auto;
      max-width: 100%;
      image-rendering: auto;
      background: #14101f;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
    }
    #hint {
      width: 100%;
      padding: 7px 14px;
      text-align: center;
      font-size: 13px;
      letter-spacing: 0.02em;
      color: #c8bfd8;
      background: rgba(14, 11, 23, 0.9);
      border-top: 1px solid rgba(255, 184, 120, 0.16);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hint">W/S throttle &middot; Arrows steer &middot; Q/E rudder &middot; Space brake &middot; G gear &middot; F flaps &middot; X drop &middot; V view &middot; P pause &middot; R restart &middot; M mute</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
